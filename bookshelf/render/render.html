<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Bookshelf Render</title>
<style>
  :root { --bg: #F3F0EA; --ink: #1D1D1B; --muted: #6B675F; --accent: #C9663D; }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: "Noto Sans CJK KR", "Noto Sans KR", sans-serif; color: var(--ink); }
  #stage { position: relative; }
  canvas { display: block; }
  svg.overlay { position: absolute; inset: 0; pointer-events: none; }
  .label { position: absolute; font-size: 13px; line-height: 1.35; white-space: nowrap;
           background: rgba(243,240,234,.9); padding: 3px 6px; border-left: 2px solid var(--ink); }
  .label b { font-weight: 700; }
  .label.accent { border-left-color: var(--accent); }
  .cap { position: absolute; font-size: 15px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .sub { position: absolute; font-size: 13px; color: var(--muted); }
</style>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"></div>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const P = new URLSearchParams(location.search);
const VIEW = P.get('view') || 'hero';
const W = +(P.get('w') || 1600), H = +(P.get('h') || 1100);

// book_module.scad 기본값과 같아야 한다
const C = { top_t: 4, pad: 1.5, clear_t: 0.6, lift: 10.5, pin_d: 4, pin_depth: 3, grid: 10 };
const COL = { module: 0xECE7DF, shoe: 0x8E8780, wedge: 0xC9663D, pad: 0xB48A5A,
              pages: 0xF1EBDD, wall: 0xF7F5F1, floor: 0xD9D3C9, bg: 0xF3F0EA };
// 다른 페이지에 맞출 때: ?bg=F1F2EE&wall=F6F7F3&floor=DADDD6&accent=E2572B
for (const [k, key] of [['bg', 'bg'], ['wall', 'wall'], ['floor', 'floor'], ['accent', 'wedge']])
  if (P.get(k)) COL[key] = parseInt(P.get(k), 16);
if (P.get('bg')) document.documentElement.style.setProperty('--bg', '#' + P.get('bg'));
if (P.get('accent')) document.documentElement.style.setProperty('--accent', '#' + P.get('accent'));

const OUT = P.get('out') || 'out';
const layout = await (await fetch(`../${OUT}/layout.json`)).json();
const loader = new STLLoader();
const cache = new Map();
const STLDIR = P.get('stl') || 'stl';                // 골조형: ?stl=stl_skel&skel=1
const stl = (name, dir = STLDIR) => {
  const key = dir + '/' + name;
  if (!cache.has(key)) cache.set(key, loader.loadAsync(`../${OUT}/${dir}/${name}.stl`));
  return cache.get(key);
};
const STUDIO = P.get('look') === 'studio';
// 칸 기준 치수: 눕힌 책은 두께가 위아래, 높이가 좌우
const eff = b => (b.lay ? { T: b.h, HH: b.t } : { T: b.t, HH: b.h });
const std = (color, roughness = 0.8) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 });
// 스튜디오 모드의 PETG: 살짝 반광
const petg = () => STUDIO
  ? new THREE.MeshPhysicalMaterial({ color: 0xEFECE6, roughness: 0.46, clearcoat: 0.18, clearcoatRoughness: 0.55 })
  : std(COL.module, 0.72);
const shadowAll = o => o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

// 책: 표지·책등은 표지색, 위아래·앞마구리는 종이색. 책등에 제목 띠.
function bookMesh(b) {
  const cover = std(new THREE.Color(P.get('bookColor') ? '#' + P.get('bookColor') : b.color),
                    STUDIO ? (b.kind === 'art' ? 0.38 : 0.68) : 0.55),
        pages = std(COL.pages, 0.95);
  // BoxGeometry 면 순서: +x, -x, +y(벽 쪽 = 앞마구리), -y(책등), +z, -z
  const { T, HH } = eff(b);
  const g = new THREE.Group();
  // 눕힌 책은 표지가 위아래(±z), 세운 책은 표지가 좌우(±x)
  const faces = b.lay ? [pages, pages, pages, cover, cover, cover] : [cover, cover, pages, cover, pages, pages];
  g.add(new THREE.Mesh(new THREE.BoxGeometry(T, b.w, HH), faces));
  const c = new THREE.Color(P.get('bookColor') ? '#' + P.get('bookColor') : b.color);
  const lum = 0.3 * c.r + 0.59 * c.g + 0.11 * c.b;
  const k = b.kind === 'art' ? 0.34 : 0.24, off = b.kind === 'art' ? 0.1 : 0.16;
  const band = new THREE.Mesh(
    b.lay ? new THREE.BoxGeometry(T * k, 0.6, Math.max(2, HH * 0.55))
          : new THREE.BoxGeometry(Math.max(2, T * 0.55), 0.6, HH * k),
    std(lum > 0.5 ? 0x2A2A28 : 0xF3EFE6, 0.7));
  band.position.set(b.lay ? -T * off : 0, -b.w / 2 - 0.3, b.lay ? 0 : HH * off);
  g.add(band);
  shadowAll(g);
  return g;
}

// 모듈 하나 (모듈 좌표계: x 두께, y 깊이(0=앞), z 위)
async function makeUnit(b, ex = {}) {
  const d = b.dims, u = new THREE.Group(), dir = ex.dir || STLDIR, skel = ex.skel ?? !!P.get('skel');
  const add = (geo, mat, pos = [0, 0, 0]) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(...pos);
    m.castShadow = m.receiveShadow = true; u.add(m); return m;
  };
  add(await stl(`${b.id}_module`, dir), petg());
  if (ex.frameOnly) return u;
  const bo = ex.book || [0, 0, 0];
  add(await stl(`${b.id}_shoe`, dir), std(COL.shoe, 0.7), bo);
  add(await stl(`${b.id}_wedge`, dir), std(COL.wedge, 0.55), ex.wedge || [0, 0, 0]);
  if (skel) {                                         // 골조형: 패드는 표지 판 위 두 줄
    const pw = C.clear_t + 2.5 + 2;
    for (const x0 of [d.sx, d.X - pw])
      add(new THREE.BoxGeometry(pw, b.w, C.pad), std(COL.pad, 0.95), [x0 + pw / 2, b.w / 2, d.Z - C.top_t - C.pad / 2]);
  } else
    add(new THREE.BoxGeometry(d.cav, b.w, C.pad), std(COL.pad, 0.95),
        [d.sx + d.cav / 2, b.w / 2, d.Z - C.top_t - C.pad / 2]);
  if (!ex.noBook) {
    const { T, HH } = eff(b);
    const bk = bookMesh(b);
    bk.position.set(d.sx + C.clear_t + T / 2 + bo[0], b.w / 2 + bo[1], d.pz + C.lift + HH / 2 + bo[2]);
    u.add(bk);
  }
  return u;
}

function makeRenderer() {
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(window.devicePixelRatio);
  r.setSize(W, H);
  r.shadowMap.enabled = true;
  r.shadowMap.type = THREE.PCFSoftShadowMap;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.05;
  r.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('stage').appendChild(r.domElement);
  return r;
}

function addRoom(scene, withWall = true) {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), std(COL.floor, 0.95));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  if (withWall) {
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(8000, 5000), std(COL.wall, 0.95));
    wall.position.set(0, 2500, -0.5); wall.receiveShadow = true; scene.add(wall);
  }
}

function addLights(scene, box, dir, strength = 2.4) {
  if (STUDIO) strength *= +(P.get('key') || 0.62);
  scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xD6CFC4, STUDIO ? +(P.get('hemi') || 0.3) : 1.15));
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const R = Math.max(s.x, s.y, s.z);
  const sun = new THREE.DirectionalLight(0xFFF8EE, strength);
  sun.position.copy(c).add(new THREE.Vector3(...dir).normalize().multiplyScalar(R * 3));
  sun.target.position.copy(c);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  const cam = sun.shadow.camera;
  cam.left = cam.bottom = -R * 1.3; cam.right = cam.top = R * 1.3;
  cam.near = R * 0.5; cam.far = R * 6;
  sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.6;
  scene.add(sun, sun.target);
  const fill = new THREE.DirectionalLight(0xE8EEF5, STUDIO ? 0.15 : 0.45);
  fill.position.copy(c).add(new THREE.Vector3(1, 0.4, 0.8).multiplyScalar(R * 3));
  scene.add(fill);
}

// 우리 좌표(z 위) → three 좌표(y 위)
function worldGroup() { const g = new THREE.Group(); g.rotation.x = -Math.PI / 2; return g; }

// 상자 모서리 8개가 화면의 margin 안에 들어오는 거리를 이분 탐색으로 찾는다
function perspective(box, dir, fov = 26, margin = 0.86, aspect = W / H, shift = [0, 0]) {
  const cam = new THREE.PerspectiveCamera(fov, aspect, 10, 50000);
  const c = box.getCenter(new THREE.Vector3());
  const look = c.clone().add(new THREE.Vector3(shift[0], shift[1], 0));
  const u = new THREE.Vector3(...dir).normalize();
  const corners = [];
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y])
    for (const z of [box.min.z, box.max.z]) corners.push(new THREE.Vector3(x, y, z));
  const extent = d => {
    cam.position.copy(look).addScaledVector(u, d); cam.lookAt(look);
    cam.updateMatrixWorld(); cam.updateProjectionMatrix();
    return Math.max(...corners.map(p => { const q = p.clone().project(cam); return Math.max(Math.abs(q.x), Math.abs(q.y)); }));
  };
  let lo = 10, hi = 40000;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (extent(mid) > margin) lo = mid; else hi = mid; }
  extent(hi);
  return cam;
}

// 라벨: 3D 점 → 화면 좌표, 지시선
function labels(items, cam, vp, group) {
  const stage = document.getElementById('stage');
  let svg = stage.querySelector('svg.overlay');
  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'overlay'); svg.setAttribute('width', W); svg.setAttribute('height', H);
    stage.appendChild(svg);
  }
  group.updateMatrixWorld(true);
  for (const it of items) {
    const p = new THREE.Vector3(...it.at).applyMatrix4(group.matrixWorld).project(cam);
    const x = vp.x + (p.x + 1) / 2 * vp.w, y = vp.y + (1 - p.y) / 2 * vp.h;
    const lx = x + it.dx, ly = y + it.dy;
    const col = it.accent ? '#C9663D' : '#1D1D1B';
    svg.insertAdjacentHTML('beforeend',
      `<line x1="${x}" y1="${y}" x2="${lx}" y2="${ly}" stroke="${col}" stroke-width="1"/>` +
      `<circle cx="${x}" cy="${y}" r="3" fill="${col}"/>`);
    const el = document.createElement('div');
    el.className = 'label' + (it.accent ? ' accent' : '');
    el.innerHTML = it.text;
    stage.appendChild(el);
    const r = el.getBoundingClientRect();
    const left = Math.min(Math.max(it.dx < 0 ? lx - r.width : lx, vp.x + 12), vp.x + vp.w - r.width - 12);
    el.style.left = left + 'px';
    el.style.top = (ly - r.height / 2) + 'px';
  }
}
function text(cls, html, x, y) {
  const el = document.createElement('div'); el.className = cls; el.innerHTML = html;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.getElementById('stage').appendChild(el);
}

// ------------------------------------------------------------
// 최대 높이 위의 창문 (창턱 = max_height)
function addWindow(scene, cx, sill) {
  const w = 1400, h = 1100, f = 45;
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ color: 0xE9F0F4, emissive: 0xDCE7EE, emissiveIntensity: 0.55, roughness: 0.3 }));
  glass.position.set(cx, sill + h / 2, 1); scene.add(glass);
  const frameMat = std(0xFBFAF7, 0.6);
  const bar = (bw, bh, x, y, d = 40) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, d), frameMat);
    m.position.set(x, y, d / 2); m.castShadow = m.receiveShadow = true; scene.add(m);
  };
  bar(w + 2 * f, f, cx, sill + h + f / 2);           // 위
  bar(f, h, cx - w / 2 - f / 2, sill + h / 2);       // 왼쪽
  bar(f, h, cx + w / 2 + f / 2, sill + h / 2);       // 오른쪽
  bar(f * 0.6, h, cx, sill + h / 2, 30);             // 가운데 창살
  bar(w + 2 * f + 60, 22, cx, sill - 11, 70);        // 창턱
}

async function shelfScene(books) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(COL.bg);
  const world = worldGroup(); scene.add(world);
  const emptyIds = (P.get('empty') || '').split(',').filter(Boolean);
  for (const b of books) {
    const u = await makeUnit(b, { frameOnly: !!P.get('frames') || emptyIds.includes(b.id) });
    u.position.set(...b.pos);
    world.add(u);
  }
  // 괴임 블록 (엇쌓기 배치에서 높이 차이를 메운다)
  for (const q of layout.shims || []) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(q.X, q.Y, q.H),
      new THREE.MeshStandardMaterial({ color: COL.wedge, roughness: 0.6 }));
    m.position.set(q.x + q.X / 2, -q.Y / 2, q.z + q.H / 2);
    m.castShadow = m.receiveShadow = true;
    world.add(m);
  }
  const box = new THREE.Box3().setFromObject(world);
  addRoom(scene);
  const sill = layout.max_height;
  if (sill) {
    const c = box.getCenter(new THREE.Vector3());
    addWindow(scene, c.x, sill);
    if (P.get('ctx')) box.expandByPoint(new THREE.Vector3(c.x, sill + 90, 0));   // 창문까지 보이게
  }
  return { scene, world, box };
}

if (VIEW === 'hero' || VIEW === 'front') {
  const r = makeRenderer();
  const { scene, box } = await shelfScene(layout.books);
  let cam;
  if (VIEW === 'hero') {
    addLights(scene, box, [-0.9, 1.25, 0.95]);
    cam = perspective(box, [-0.55, 0.26, 1], 24, 0.8);
  } else {
    addLights(scene, box, [-0.75, 1.0, 1.0], 2.2);
    const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    const hh = s.y / 2 * 1.16, hw = hh * W / H;
    cam = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 10, 20000);
    cam.position.set(c.x, c.y, 6000); cam.lookAt(c.x, c.y, 0);
  }
  if (STUDIO) { tighten(cam, box); studioEnv(r, scene, +(P.get('env') || 0.75)); }
  renderFinal(r, scene, cam);
}

if (VIEW === 'detail') {
  const r = makeRenderer();
  r.setScissorTest(true);
  const b = layout.books.find(x => x.id === (P.get('id') || '05'));
  const d = b.dims;
  const half = { w: W / 2, h: H };

  // A: 조립 상태, 왼쪽 앞에서 (닫힌 측벽)
  const sA = new THREE.Scene(); sA.background = new THREE.Color(COL.bg);
  const gA = worldGroup(); sA.add(gA);
  gA.add(await makeUnit(b));
  addRoom(sA, false);
  const boxA = new THREE.Box3().setFromObject(gA);
  addLights(sA, boxA, [-0.6, 1.3, 0.9], 2.3);
  const camA = perspective(boxA, [-1.0, 0.42, 0.78], 24, 0.72, half.w / half.h);

  // B: 책을 꺼낼 때, 오른쪽 앞 위에서 (열린 쪽으로 칸 안이 보이게)
  const sB = new THREE.Scene(); sB.background = new THREE.Color(COL.bg);
  const gB = worldGroup(); sB.add(gB);
  const OUTB = -230, OUTW = -430;
  gB.add(await makeUnit(b, { book: [0, OUTB, 0], wedge: [0, OUTW, 0] }));
  // 원래 자리: 점선 윤곽
  const ghost = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(b.t, b.w, b.h)),
    new THREE.LineDashedMaterial({ color: 0x1D1D1B, dashSize: 6, gapSize: 5, transparent: true, opacity: 0.55 }));
  ghost.position.set(d.sx + C.clear_t + b.t / 2, b.w / 2, d.pz + C.lift + b.h / 2);
  ghost.computeLineDistances();
  gB.add(ghost);
  addRoom(sB, false);
  const boxB = new THREE.Box3().setFromObject(gB);
  addLights(sB, boxB, [0.3, 1.4, 1.0], 2.3);
  const camB = perspective(boxB, [1.0, 0.72, 0.62], 24, 0.74, half.w / half.h);

  for (const [s, cam, x] of [[sA, camA, 0], [sB, camB, W / 2]]) {
    r.setViewport(x, 0, half.w, half.h); r.setScissor(x, 0, half.w, half.h);
    r.render(s, cam);
  }

  const bx = d.sx + d.cav / 2, top = d.pz + C.lift + b.h;
  labels([
    { at: [0, 6, d.Z * 0.6], dx: -60, dy: -170, text: '<b>닫힌 측벽</b> — 한쪽에만 있다<br>창으로 표지가 보인다' },
    { at: [0, d.Y * 0.3, d.pz / 2], dx: -30, dy: 70, text: '<b>바닥판</b> — 격자와 책의 차이만큼 두꺼워진다<br>측면에 번호·입고일·책 치수 각인' },
    { at: [d.X / 2, d.Y - 20, d.Z], dx: 40, dy: -70, text: '<b>윗판</b> · 핀 구멍 10mm 격자' },
    { at: [bx, 0, d.pz + C.lift + b.h * 0.55], dx: 70, dy: 40, text: '<b>책등</b>이 모듈 앞면과 같은 면' },
    { at: [bx, -12, d.pz + 4], dx: 60, dy: 60, accent: true, text: '<b>쐐기 손잡이</b>' },
  ], camA, { x: 0, y: 0, w: half.w, h: half.h }, gA);
  const bookR = d.sx + C.clear_t + b.t;
  labels([
    { at: [d.X, d.Y * 0.55, d.Z - C.top_t / 2], dx: -40, dy: -120, text: '<b>열린 쪽</b> — 윗판 모서리를 책이 받친다<br>책이 빠지면 이 모서리가 처진다' },
    { at: [d.sx + d.cav * 0.75, d.Y * 0.8, d.Z - C.top_t - C.pad], dx: 40, dy: -70, text: '<b>코르크 패드</b> 1.5 mm' },
    { at: [d.X / 2, d.Y - d.by, d.Z - C.top_t - 16], dx: 30, dy: 110, text: '<b>뒷벽</b> · 벽 고정 열쇠구멍' },
    { at: [d.sx + C.clear_t + b.t, b.w * 0.45, d.pz + C.lift + b.h * 0.35], dx: 60, dy: 150, text: '점선 — 책이 있던 자리' },
    { at: [bookR, OUTB + b.w * 0.5, d.pz + C.lift + b.h * 0.62], dx: -90, dy: -110, text: '<b>책 + 받침</b>이 함께 빠진다' },
    { at: [bx, OUTW + 70, d.pz + 5], dx: -50, dy: 80, accent: true, text: '<b>쐐기</b>를 먼저 빼면 받침이 2 mm 내려가<br>하중이 풀린다 (쌍쐐기)' },
  ], camB, { x: W / 2, y: 0, w: half.w, h: half.h }, gB);

  text('cap', 'A. 조립된 상태', 28, 22);
  text('cap', 'B. 책을 꺼낼 때', W / 2 + 28, 22);
  text('sub', `${b.id} ${b.label} · 책 ${b.h}×${b.w}×${b.t} mm → 모듈 ${d.X}×${d.Y}×${d.Z} mm (격자 10 mm)`, 28, H - 36);
  const line = document.createElement('div');
  line.style.cssText = `position:absolute;left:${W / 2}px;top:24px;width:1px;height:${H - 80}px;background:#D3CEC5`;
  document.getElementById('stage').appendChild(line);
}

// 정사영(축측) 카메라: 상자 모서리가 화면 margin 안에 들어오게
function axo(box, dir, margin = 0.86, aspect = W / H) {
  const c = box.getCenter(new THREE.Vector3()), R = box.getSize(new THREE.Vector3()).length();
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, R * 10);
  cam.position.copy(c).addScaledVector(new THREE.Vector3(...dir).normalize(), R * 3);
  cam.lookAt(c); cam.updateMatrixWorld();
  let hx = 0, hy = 0;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const p = new THREE.Vector3(x, y, z).applyMatrix4(cam.matrixWorldInverse);
    hx = Math.max(hx, Math.abs(p.x)); hy = Math.max(hy, Math.abs(p.y));
  }
  const h = Math.max(hy, hx / aspect) / margin;
  cam.left = -h * aspect; cam.right = h * aspect; cam.top = h; cam.bottom = -h;
  cam.updateProjectionMatrix();
  return cam;
}

// ---------------- 스튜디오 렌더: 환경광, 접촉 그림자(AO), 사이클로라마 ----------------
function studioEnv(r, scene, envI = 0.8) {
  const pm = new THREE.PMREMGenerator(r);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.traverse(o => { if (o.isMesh) for (const m of [].concat(o.material)) { m.envMapIntensity = envI; m.needsUpdate = true; } });
}
function tighten(cam, box) {
  if (!cam.isPerspectiveCamera) return;
  const c = box.getCenter(new THREE.Vector3()), d = cam.position.distanceTo(c), R = box.getSize(new THREE.Vector3()).length();
  cam.near = Math.max(5, d - R * 1.5); cam.far = d + R * 3; cam.updateProjectionMatrix();
}
function renderFinal(r, scene, cam) {
  if (!P.get('ao')) { r.render(scene, cam); return; }
  const comp = new EffectComposer(r);
  comp.setPixelRatio(window.devicePixelRatio); comp.setSize(W, H);
  comp.addPass(new RenderPass(scene, cam));
  const ao = new SSAOPass(scene, cam, W, H);
  ao.kernelRadius = +(P.get('aoR') || 10); ao.minDistance = +(P.get('aoMin') || 0.0004); ao.maxDistance = +(P.get('aoMax') || 0.03);
  comp.addPass(ao);
  comp.addPass(new OutputPass());
  comp.render();
}
// 바닥에서 벽으로 둥글게 이어지는 배경
function coveGeometry(L, Zb, R, Hwall, Dfloor, N = 28) {
  const prof = [[0, Dfloor]];
  for (let i = 0; i <= N; i++) { const t = i / N * Math.PI / 2; prof.push([R - R * Math.cos(t), -Zb + R - R * Math.sin(t)]); }
  prof.push([Hwall, -Zb]);
  const pos = [], idx = [];
  prof.forEach(([y, z], i) => { pos.push(-L, y, z, L, y, z); if (i) { const a = (i - 1) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function addCove(scene, color = 0xE6E7E3, Zb = 900, R = 600) {
  const m = new THREE.Mesh(coveGeometry(6000, Zb, R, 5000, 4000),
    new THREE.MeshStandardMaterial({ color, roughness: 1, side: THREE.DoubleSide }));
  m.receiveShadow = true; scene.add(m);
}
function tagUnder(text, obj, cam, dy = 16) {
  const bx = new THREE.Box3().setFromObject(obj);
  let x0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const x of [bx.min.x, bx.max.x]) for (const y of [bx.min.y, bx.max.y]) for (const z of [bx.min.z, bx.max.z]) {
    const p = new THREE.Vector3(x, y, z).project(cam);
    const sx = (p.x + 1) / 2 * W, sy = (1 - p.y) / 2 * H;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y1 = Math.max(y1, sy);
  }
  const el = document.createElement('div');
  el.className = 'cap'; el.innerHTML = text;
  el.style.left = ((x0 + x1) / 2) + 'px'; el.style.top = (y1 + dy) + 'px'; el.style.transform = 'translateX(-50%)';
  document.getElementById('stage').appendChild(el);
}
function tag(text, at, group, cam, dy = 0) {
  group.updateMatrixWorld(true);
  const p = new THREE.Vector3(...at).applyMatrix4(group.matrixWorld).project(cam);
  const el = document.createElement('div');
  el.className = 'cap'; el.innerHTML = text;
  el.style.left = ((p.x + 1) / 2 * W) + 'px'; el.style.top = ((1 - p.y) / 2 * H + dy) + 'px';
  el.style.transform = 'translateX(-50%)';
  document.getElementById('stage').appendChild(el);
}

// ---------------- 막대·마디 골조 (가변형 개념) ----------------
const ROD = { r: 4, node: 15, wood: 0xD8BC90, nodeCol: 0xF1EEE8 };
// 칸 하나의 테두리 선분: 위아래 사각형, 기둥은 왼쪽 앞·뒤와 오른쪽 뒤 (오른쪽 앞은 책이 받친다)
function baySegs(x0, x1, z0, z1, yf, yb = -4) {
  const s = [];
  for (const z of [z0, z1]) {
    s.push(['x', yf, z, x0, x1], ['x', yb, z, x0, x1], ['y', x0, z, yf, yb], ['y', x1, z, yf, yb]);
  }
  s.push(['z', x0, yf, z0, z1], ['z', x0, yb, z0, z1], ['z', x1, yb, z0, z1]);
  return s;
}
function spacerSegs(parts) {
  const s = [];
  for (const q of parts || []) {
    const yf = -q.Y, yb = -4;
    if (q.kind === 'plate') {
      const z = q.z + q.H;
      s.push(['x', yf, z, q.x, q.x + q.X], ['x', yb, z, q.x, q.x + q.X], ['y', q.x, z, yf, yb], ['y', q.x + q.X, z, yf, yb]);
    } else {
      const xc = q.x + q.X / 2;
      s.push(['z', xc, yf, q.z, q.z + q.H + 10], ['z', xc, yb, q.z, q.z + q.H + 10]);
    }
  }
  return s;
}
// 같은 선 위의 선분을 합치고, 끝점마다 마디를 둔다
function buildFrame(segs) {
  const lines = new Map(), nodes = new Map();
  const key = (a, b, c) => `${a}|${Math.round(b * 10)}|${Math.round(c * 10)}`;
  const pt = (ax, f1, f2, v) => ax === 'x' ? [v, f1, f2] : ax === 'y' ? [f1, v, f2] : [f1, f2, v];
  for (const [ax, f1, f2, a, b] of segs) {
    const k = key(ax, f1, f2);
    if (!lines.has(k)) lines.set(k, { ax, f1, f2, iv: [] });
    lines.get(k).iv.push([Math.min(a, b), Math.max(a, b)]);
    for (const v of [a, b]) { const p = pt(ax, f1, f2, v); nodes.set(p.map(n => Math.round(n)).join(','), p); }
  }
  const rods = [];
  for (const L of lines.values()) {
    L.iv.sort((p, q) => p[0] - q[0]);
    let [a, b] = L.iv[0];
    for (const [c, d] of L.iv.slice(1)) { if (c <= b + 0.5) b = Math.max(b, d); else { rods.push([L.ax, L.f1, L.f2, a, b]); [a, b] = [c, d]; } }
    rods.push([L.ax, L.f1, L.f2, a, b]);
  }
  const g = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: ROD.wood, roughness: 0.62 });
  const nodeMat = STUDIO ? new THREE.MeshPhysicalMaterial({ color: ROD.nodeCol, roughness: 0.42, clearcoat: 0.2 }) : std(ROD.nodeCol, 0.6);
  for (const [ax, f1, f2, a, b] of rods) {
    const len = b - a - ROD.node * 0.6; if (len <= 0) continue;
    const m = new THREE.Mesh(new THREE.CylinderGeometry(ROD.r, ROD.r, len, 20), wood);
    const mid = pt(ax, f1, f2, (a + b) / 2); m.position.set(...mid);
    if (ax === 'x') m.rotation.z = Math.PI / 2; else if (ax === 'z') m.rotation.x = Math.PI / 2;
    m.castShadow = m.receiveShadow = true; g.add(m);
  }
  const ng = new RoundedBoxGeometry(ROD.node, ROD.node, ROD.node, 3, 2.6);
  for (const p of nodes.values()) {
    const m = new THREE.Mesh(ng, nodeMat); m.position.set(...p); m.castShadow = m.receiveShadow = true; g.add(m);
  }
  g.userData = { rods: rods.length, nodes: nodes.size };
  return g;
}
// 칸 안: 받침(높이 미세 조절) + 쐐기 손잡이 + 책
function bayFill(b, withBook = true) {
  const d = b.dims, g = new THREE.Group(), x0 = b.pos[0], z0 = b.pos[2], { T, HH } = eff(b);
  const shoeH = d.Z - 2 * ROD.r - C.pad - HH;                  // 격자와 책 높이의 차이를 받침이 받는다
  const bx = x0 + d.sx + C.clear_t;
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(d.X - 2, b.w, shoeH), std(COL.shoe, 0.7));
  shoe.position.set(x0 + d.X / 2, -d.Y + b.w / 2, z0 + ROD.r + shoeH / 2); g.add(shoe);
  const tab = new THREE.Mesh(new THREE.BoxGeometry(Math.min(12, T), 14, 6), std(COL.wedge, 0.55));
  tab.position.set(bx + T / 2, -d.Y - 7, z0 + ROD.r + 3); g.add(tab);
  if (withBook) {
    const bk = bookMesh(b);
    bk.position.set(bx + T / 2, -d.Y + b.w / 2, z0 + ROD.r + shoeH + HH / 2); g.add(bk);
  }
  shadowAll(g);
  return g;
}
async function rodScene(L, opts = {}) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(COL.bg);
  const world = worldGroup(); scene.add(world);
  const emptyIds = (P.get('empty') || '').split(',').filter(Boolean);
  let segs = [];
  for (const b of L.books) {
    const d = b.dims;
    segs = segs.concat(baySegs(b.pos[0], b.pos[0] + d.X, b.pos[2], b.pos[2] + d.Z, -d.Y));
    if (!opts.frames) world.add(bayFill(b, !emptyIds.includes(b.id)));
  }
  segs = segs.concat(spacerSegs(L.shims));
  const frame = buildFrame(segs); world.add(frame);
  return { scene, world, frame, box: new THREE.Box3().setFromObject(world) };
}

    for (const id of [P.get('id'), ...(P.get('ids') || '').split(',').filter(Boolean)]) {
      const q = layout.books.find(x => x.id === id), d = q.dims;
      const a = new THREE.Vector3(q.pos[0], q.pos[2], 0), c = new THREE.Vector3(q.pos[0] + d.X, q.pos[2] + d.Z, d.Y);
      focus.expandByPoint(a); focus.expandByPoint(c);
    }
    focus.expandByScalar(20);
  }
  const cam = perspective(focus, dir, +(P.get('fov') || 24), +(P.get('margin') || 0.8));
  tighten(cam, box);
  studioEnv(r, scene, +(P.get('env') || 0.75));
  renderFinal(r, scene, cam);
  for (const eid of (P.get('empty') || '').split(',').filter(Boolean)) {
    const q = layout.books.find(x => x.id === eid), d = q.dims;
    labels([{ at: [q.pos[0] + d.X / 2, -d.Y, q.pos[2] + d.Z * 0.45], dx: -150, dy: 70, accent: true,
              text: '<b>책을 뺀 칸</b><br>위 칸은 이어진 골조로 옆 칸에 하중을 넘긴다' }], cam, { x: 0, y: 0, w: W, h: H }, world);
  }
  console.log('rods', frame.userData.rods, 'nodes', frame.userData.nodes);
}

// 출력형 모듈(A)과 막대·마디 칸(B)을 나란히
if (VIEW === 'rodmod') {
  const r = makeRenderer();
  const b = layout.books.find(x => x.id === (P.get('id') || '11')), d = b.dims;
  const empty = !!P.get('empty'), gap = +(P.get('gap') || 150);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xE6E7E3);
  const g = worldGroup(); scene.add(g);
  const A = await makeUnit(b, { dir: STLDIR, skel: false, frameOnly: empty });
  A.position.set(-d.X - gap / 2, -d.Y / 2, 0); g.add(A);
  const bb = { ...b, pos: [0, 0, 0] };
  const B = new THREE.Group();
  B.add(buildFrame(baySegs(0, d.X, 0, d.Z, -d.Y)));
  if (!empty) B.add(bayFill(bb));
  B.position.set(gap / 2, d.Y / 2, 0); g.add(B);
  addCove(scene);
  const box = new THREE.Box3().setFromObject(g);
  addLights(scene, box, [-0.75, 1.35, 0.85], 2.6);
  const dir = (P.get('dir') || '0.62,0.48,1').split(',').map(Number);
  const cam = perspective(box, dir, +(P.get('fov') || 20), +(P.get('margin') || 0.78));
  tighten(cam, box);
  studioEnv(r, scene, +(P.get('env') || 0.8));
  renderFinal(r, scene, cam);
  g.updateMatrixWorld(true);
  tagUnder('A · 출력형 칸', A, cam); tagUnder('B · 막대와 마디', B, cam);
}

window.__done = true;
</script>
